<!DOCTYPE html>
<html>
<head>
    <title>Remove Day Pass Duplicates</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        button {
            background: #3b82f6;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 5px;
        }
        button:hover {
            background: #2563eb;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: #f3f4f6;
        }
        .success {
            background: #d1fae5;
            color: #065f46;
        }
        .error {
            background: #fee2e2;
            color: #991b1b;
        }
    </style>
</head>
<body>
    <h1>🧹 Remove Day Pass Walk-In Duplicates</h1>
    <p>This will remove duplicate records from the day_pass_walk_in table, keeping only the oldest record for each unique combination.</p>
    
    <button onclick="removeDuplicates()">Remove Duplicates</button>
    <button onclick="checkCount()">Check Current Count</button>
    
    <div id="result"></div>

    <script>
        async function removeDuplicates() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>⏳ Removing duplicates...</p>';
            
            try {
                const response = await fetch('http://localhost:8081/api/admin/remove-day-pass-duplicates', {
                    method: 'POST',
                    credentials: 'include'
                });
                
                const data = await response.json();
                
                if (data.success) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
                        <h3>✅ Success!</h3>
                        <p><strong>Before:</strong> ${data.before} records</p>
                        <p><strong>After:</strong> ${data.after} records</p>
                        <p><strong>Removed:</strong> ${data.before - data.after} duplicate records</p>
                    `;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `<h3>❌ Error</h3><p>${data.message}</p>`;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `<h3>❌ Error</h3><p>${error.message}</p>`;
            }
        }

        async function checkCount() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>⏳ Checking count...</p>';
            
            try {
                const response = await fetch('http://localhost:8081/api/bookings/day-pass-walk-in', {
                    credentials: 'include'
                });
                
                const data = await response.json();
                
                if (data.success) {
                    resultDiv.className = 'result';
                    resultDiv.innerHTML = `
                        <h3>📊 Current Records</h3>
                        <p><strong>Total:</strong> ${data.bookings.length} records</p>
                    `;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `<h3>❌ Error</h3><p>${data.message}</p>`;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `<h3>❌ Error</h3><p>${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
